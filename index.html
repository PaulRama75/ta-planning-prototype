<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAMISCOPE TA Planning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: navy app sidebar + scrolling work area, as in the TA Planning module; cards for working surfaces only. */
:root {
  --bg: #F4F5F7; --card: #FFFFFF; --ink: #111827; --muted: #4B5563; --line: #E5E7EB; --line2: #D1D5DB;
  --head: #F9FAFB; --row: #F1F2F4; --calc: #F3F4F6;
  --side: #0F1B2D; --side2: #1E293B; --side-on: #1E3A8A; --side-ink: #CBD5E1; --side-dim: #94A3B8;
  --accent: #1D4ED8; --accent-hover: #1E3A8A; --on-accent: #FFFFFF; --link: #1D4ED8;
  --soft: #EFF6FF; --soft-line: #BFDBFE; --soft-ink: #1E3A8A;
  --warn: #C2410C;
  --ok: #15803D; --ok-soft: #DCFCE7; --ok-ink: #166534;
  --amber-soft: #FEF3C7; --amber-ink: #92400E;
  --bad-soft: #FEE2E2; --bad-ink: #991B1B; --bad-line: #FCA5A5;
  --chip: #E5E7EB; --chip-ink: #111827;
  --banner: #FEF3C7; --banner-ink: #78350F;
  --shadow: 0 20px 50px rgba(15, 27, 45, .25);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1220; --card: #111A2B; --ink: #E5E7EB; --muted: #A3ACBA; --line: #22304A; --line2: #34435E;
  --head: #0F1829; --row: #1A263B; --calc: #0E1626;
  --side: #070D18; --side2: #15203A; --side-on: #1E3A8A; --side-ink: #CBD5E1; --side-dim: #94A3B8;
  --accent: #2563EB; --accent-hover: #1D4ED8; --on-accent: #FFFFFF; --link: #93C5FD;
  --soft: #172554; --soft-line: #1E3A8A; --soft-ink: #BFDBFE;
  --warn: #FB923C;
  --ok: #16A34A; --ok-soft: #052E1A; --ok-ink: #86EFAC;
  --amber-soft: #3A2A06; --amber-ink: #FCD34D;
  --bad-soft: #3B0D0D; --bad-ink: #FCA5A5; --bad-line: #7F1D1D;
  --chip: #263247; --chip-ink: #E5E7EB;
  --banner: #3A2A06; --banner-ink: #FDE68A;
  --shadow: 0 20px 50px rgba(0, 0, 0, .5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0B1220; --card: #111A2B; --ink: #E5E7EB; --muted: #A3ACBA; --line: #22304A; --line2: #34435E;
  --head: #0F1829; --row: #1A263B; --calc: #0E1626;
  --side: #070D18; --side2: #15203A; --side-on: #1E3A8A; --side-ink: #CBD5E1; --side-dim: #94A3B8;
  --accent: #2563EB; --accent-hover: #1D4ED8; --on-accent: #FFFFFF; --link: #93C5FD;
  --soft: #172554; --soft-line: #1E3A8A; --soft-ink: #BFDBFE;
  --warn: #FB923C;
  --ok: #16A34A; --ok-soft: #052E1A; --ok-ink: #86EFAC;
  --amber-soft: #3A2A06; --amber-ink: #FCD34D;
  --bad-soft: #3B0D0D; --bad-ink: #FCA5A5; --bad-line: #7F1D1D;
  --chip: #263247; --chip-ink: #E5E7EB;
  --banner: #3A2A06; --banner-ink: #FDE68A;
  --shadow: 0 20px 50px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--link); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--display); font-size: 26px; font-weight: 600; }
h2 { font-size: 16px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
.num, .tbl td.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* shell */
.shell { display: flex; min-height: 100vh; }
.side { width: 240px; flex: 0 0 240px; background: var(--side); color: var(--side-ink); padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; flex-direction: column; gap: 6px; }
.brand img { width: 100%; max-width: 210px; height: auto; display: block; }
.brand b { color: #FFFFFF; font-size: 15px; }
.brand span { color: var(--side-dim); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--side-ink); font-weight: 500; cursor: pointer; }
.nav button:hover { background: var(--side2); color: #FFFFFF; }
.nav button.on { background: var(--side-on); color: #FFFFFF; }
.nav button:focus-visible { outline: 2px solid #93C5FD; }
.side-box { background: var(--side2); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.cap { color: var(--side-dim); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.side-box select { width: 100%; height: 34px; border-radius: 6px; border: 1px solid #334155; background: var(--side); color: #FFFFFF; padding: 0 8px; }
.side-box .lb { all: unset; color: #93C5FD; font-size: 12px; font-weight: 600; cursor: pointer; }
.side-box .lb:hover { text-decoration: underline; }
.side-foot { margin-top: auto; }
.main { flex: 1; min-width: 0; padding-block: 18px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.banner { background: var(--banner); color: var(--banner-ink); border-radius: 10px; padding: 9px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.banner b { font-weight: 700; }
@media (max-width: 900px) {
  .shell { flex-direction: column; }
  .side { width: auto; flex: none; height: auto; position: static; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 12px; }
  .brand { flex-direction: row; align-items: center; gap: 12px; }
  .brand img { width: 120px; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav button { padding: 8px 10px; }
  .side-foot { margin-top: 0; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* blocks */
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.sub { color: var(--muted); margin-top: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { align-items: flex-end; }
.spacer { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.pad { padding: 16px 20px; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; padding: 16px 20px 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.span2 { grid-column: span 2; }
@media (max-width: 1100px) { .grid3 { grid-template-columns: minmax(0, 1fr); } .span2 { grid-column: auto; } }
@media (max-width: 800px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.empty { padding: 26px 20px; text-align: center; color: var(--muted); }
.note { background: var(--head); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--head); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.good { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }
.btn.danger { border-color: var(--bad-line); color: var(--bad-ink); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn:disabled, input:disabled, select:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; }
.linkbtn { all: unset; color: var(--link); font-weight: 600; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn:focus-visible { outline: 2px solid var(--link); }
.iconbtn { border: 0; background: none; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { background: var(--row); color: var(--ink); }

.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.inp, .fld input, .fld select, .fld textarea { height: 36px; border: 1px solid var(--line2); border-radius: 8px; padding: 0 10px; font-size: 14px; font-weight: 400; color: var(--ink); background: var(--card); min-width: 0; }
.fld textarea { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; }
.fld select { min-width: 140px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--ink); }
.chk input { width: 18px; height: 18px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 16px; }
.form-grid .wide { grid-column: 1 / -1; }

.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip); color: var(--chip-ink); white-space: nowrap; }
.chip.blue { background: var(--soft); color: var(--soft-ink); }
.chip.green { background: var(--ok-soft); color: var(--ok-ink); }
.chip.amber { background: var(--amber-soft); color: var(--amber-ink); }
.chip.red { background: var(--bad-soft); color: var(--bad-ink); }
.chip.navy { background: #0F1B2D; color: #FFFFFF; }
.role { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .03em; }
.role.admin { background: #FED7AA; color: #7C2D12; }
.role.planner { background: #BFDBFE; color: #1E3A8A; }
.role.viewer { background: #E5E7EB; color: #111827; }
.view { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; }
.view.on { background: var(--side); border-color: var(--side); color: #FFFFFF; }

.bar { height: 6px; background: var(--line); border-radius: 3px; flex: 1; min-width: 40px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.full > i { background: var(--ok); }
.pct { display: flex; align-items: center; gap: 8px; }
.pct b { font-size: 13px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--head); white-space: nowrap; }
.tbl th.num { text-align: right; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--row); vertical-align: middle; }
.tbl td.num { text-align: right; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--head); }
.tbl.grid td { padding: 3px 4px; }
.tbl.grid td.calc { background: var(--calc); color: var(--muted); padding: 3px 10px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl.grid input, .tbl.grid select { width: 100%; min-width: 64px; height: 32px; border: 1px solid transparent; border-radius: 6px; padding: 0 8px; background: transparent; }
.tbl.grid input:hover:not(:disabled), .tbl.grid select:hover:not(:disabled) { border-color: var(--line2); }
.tbl.grid input:focus, .tbl.grid select:focus { border-color: var(--link); background: var(--card); outline: none; }
.tbl.grid tr.sub > td { background: var(--head); padding: 12px 16px 16px 40px; }
.saved { animation: saved 1s ease-out; }
@keyframes saved { from { background: var(--ok-soft); } to { background: transparent; } }

.job-head { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { all: unset; padding: 10px 14px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--link); border-color: var(--link); }
.tabs button:focus-visible { outline: 2px solid var(--link); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.kpi span { font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi b { font-family: var(--display); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi b.warn { color: var(--warn); }
.stack-bar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--line); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 10px; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; }
.qi { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--row); width: 100%; cursor: pointer; }
.qi:hover { background: var(--head); }
.qi.on { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
.qi:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
.diff del { color: var(--bad-ink); background: var(--bad-soft); text-decoration: line-through; padding: 0 3px; border-radius: 3px; }
.diff ins { color: var(--ok-ink); background: var(--ok-soft); text-decoration: none; padding: 0 3px; border-radius: 3px; }
.code { font-family: var(--mono); font-size: 12px; }

dialog { border: 0; border-radius: 12px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(15, 27, 45, .5); }
dialog form { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.acts { display: flex; justify-content: flex-end; gap: 8px; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 1000; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: #0F1B2D; color: #FFFFFF; border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
.toast.err { background: #991B1B; }
.toast.ok { background: #166534; }

/* sign in */
.signin { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.signin .card { width: min(520px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.signin img { width: 240px; max-width: 100%; height: auto; align-self: center; }
.levels { display: grid; gap: 10px; }
.level { all: unset; box-sizing: border-box; display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line2); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.level:hover { border-color: var(--link); background: var(--soft); }
.level:focus-visible { outline: 2px solid var(--link); }
.level div { display: flex; flex-direction: column; gap: 3px; }
.level b { font-size: 15px; }
.level span { font-size: 13px; color: var(--muted); }
</style>
</head>

// readiness, the way the module scores it: work steps (exist / durations / man-hours), materials (ready lines, 90 % cap), documents
const mhStep = (s) => s.crafts.reduce((t, c) => t + (Number(c.dur) || 0) * (Number(c.crew) || 0), 0);
const rentalStep = (s) => s.tools.reduce((t, x) => t + (Number(x.dur) || 0) * (Number(x.qty) || 0), 0);
function readiness(j) {
  const live = j.steps;
  const steps = !live.length ? 0 : 0.4 + (live.every((s) => Number(s.dur) > 0) ? 0.3 : 0) + (live.every((s) => mhStep(s) > 0) ? 0.3 : 0);
  const mats = !j.materials.length ? 0 : Math.min(0.9, j.materials.filter((m) => m.status === 'Received').length / j.materials.length);
  const docs = j.docs.required ? Math.min(1, j.docs.have / j.docs.required) : 1;
  return { steps, mats, docs, all: (steps + mats + docs) / 3, mh: live.reduce((t, s) => t + mhStep(s), 0), rental: live.reduce((t, s) => t + rentalStep(s), 0) };
}

    h('div', { class: 'row end' }, h('button', { type: 'button', class: 'btn primary', onclick: () => loadRows(SAMPLE_FILE.map((r) => [...r]), 'sample_jobs_and_tasks.xlsx') }, 'Preview the sample file'),
      h('span', { class: 'muted' }, 'or'), h('label', { class: 'fld', for: 'im-file' }, 'Upload a CSV with the export’s columns', fileIn))));

  if (S.preview) {
    const p = S.preview; const tone = { new: 'green', unchanged: '' };
    out.append(h('section', { class: 'card', 'aria-label': 'Import preview' },
      h('div', { class: 'card-head' }, h('h2', {}, `Preview: ${p.file}`), h('span', { class: 'small muted' }, 'Nothing is saved yet')),
      p.errors.length ? h('div', { class: 'stack', style: { padding: '0 20px 10px', gap: '4px' } }, p.errors.map((e) => h('span', { class: 'small', style: { color: 'var(--bad-ink)' } }, `Row ${e.row}: ${e.msg} (skipped)`))) : null,
      p.batches.map((b) => h('div', { style: { borderTop: '1px solid var(--line)' } },
        h('div', { class: 'row', style: { padding: '12px 20px' } }, h('b', {}, TAS.find((x) => x.id === b.taId).name), h('span', { class: 'chip green' }, `${b.changes.filter((c) => c.kind === 'new').length} new`), h('span', { class: 'chip' }, `${b.changes.filter((c) => c.kind === 'unchanged').length} unchanged`)),
        h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl', style: { minWidth: '640px' } }, h('thead', {}, h('tr', {}, ['Action', 'What', 'Key', 'Row', 'Details'].map((x) => h('th', {}, x)))),
          h('tbody', {}, b.changes.map((c) => h('tr', {}, h('td', {}, h('span', { class: `chip ${tone[c.kind]}` }, c.kind)), h('td', {}, c.what), h('td', { style: { whiteSpace: 'nowrap' } }, c.key), h('td', { class: 'num' }, c.row), h('td', { class: 'diff' }, c.kind === 'new' ? h('ins', {}, c.detail) : h('span', { class: 'muted' }, c.detail))))))))),
      h('div', { class: 'row', style: { padding: '12px 20px' } },
        h('button', { type: 'button', class: 'btn primary', disabled: !p.batches.length, onclick: () => { p.batches.forEach(applyBatch); toast(`Applied to ${p.batches.length} turnaround${p.batches.length === 1 ? '' : 's'}`, 'ok'); S.preview = null; render(); } }, p.batches.length > 1 ? `Apply all ${p.batches.length}` : 'Apply changes'),
        h('button', { type: 'button', class: 'btn', onclick: () => { S.preview = null; render(); } }, 'Discard'))));
  }

  const hist = S.imports.filter((i) => (S.scope === 'site' ? siteTas.some((x) => x.id === i.taId) : i.taId === S.ta));
  out.append(h('section', { class: 'card', 'aria-label': 'Import history' }, h('div', { class: 'card-head' }, h('h2', {}, 'Import history'), h('span', { class: 'small muted' }, 'Only an admin can undo an import')),
    h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl', style: { minWidth: '620px' } }, h('thead', {}, h('tr', {}, ['Turnaround', 'File', 'By', 'Result', 'Status', ''].map((x) => h('th', {}, x)))),
      h('tbody', {}, hist.length ? hist.map((i) => h('tr', {}, h('td', {}, TAS.find((x) => x.id === i.taId).name), h('td', {}, i.file), h('td', {}, i.by), h('td', {}, `${i.n} new`),
        h('td', {}, h('span', { class: `chip ${i.status === 'applied' ? 'green' : 'amber'}` }, i.status)),
        h('td', {}, i.status === 'applied' && can('admin') ? h('button', { type: 'button', class: 'btn sm danger', onclick: () => undoImport(i) }, 'Undo') : null)))
        : h('tr', {}, h('td', { colspan: 6, class: 'empty' }, 'No imports yet. Preview the sample file above to try one.')))))));
  out.append(h('section', { class: 'card pad stack', 'aria-label': 'Exports', 'data-ro': true }, h('h2', {}, 'Exports'),
    h('div', { class: 'row' }, h('span', { style: { minWidth: '220px' } }, h('b', {}, S.scope === 'site' ? `Jobs with all tasks, site ${t.site}` : `Jobs with all tasks, ${t.name}`)),
      h('button', { type: 'button', class: 'btn sm', onclick: () => exportSheet(S.scope) }, 'Show sheet'), h('span', { class: 'small muted' }, 'the same columns import back unchanged')),
    h('p', { class: 'small muted', style: { margin: 0 } }, 'The module also exports the job register, a full planning workbook, SAP orders and code lists to Excel or CSV.')));
}

// ------------------------------------------------------------------ setup & users
function setup(out) {
  const t = ta();
  out.append(h('header', { class: 'page-head' }, h('div', {}, h('h1', {}, 'Setup & codes'), h('div', { class: 'sub' }, 'Turnaround settings and the code lists behind every drop-down'))));
  if (!can('admin')) out.append(h('div', { class: 'note' }, 'Only an admin can change turnaround settings and code lists.'));
  const f = (key, label, type = 'text') => { const id = `ta-${key}`; const el = h('input', { id, type, value: t[key] || '', disabled: !can('admin') }); el.addEventListener('change', () => { t[key] = el.value; toast(`${label} saved`, 'ok'); }); return h('label', { class: 'fld', for: id }, label, el); };
  out.append(h('section', { class: 'card pad stack' }, h('h2', {}, `Turnaround: ${t.name}`), h('div', { class: 'form-grid' }, f('name', 'Turnaround name'), f('site', 'Site'), f('shutdown', 'Shutdown', 'date'), f('freeze', 'Work list freeze', 'date'))));
  out.append(h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('h2', {}, 'Crafts'), h('span', { class: 'small muted' }, 'One of 39 code lists; every code field on screen and in Excel is a drop-down from these lists')),
    h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' }, h('thead', {}, h('tr', {}, h('th', {}, 'Code'), h('th', {}, 'Name'))), h('tbody', {}, CRAFTS.map((c) => h('tr', {}, h('td', { class: 'code' }, c.value), h('td', {}, c.label.split(' · ')[1]))))))));
}
function users(out) {
  out.append(h('header', { class: 'page-head' }, h('div', {}, h('h1', {}, 'Users'), h('div', { class: 'sub' }, 'Who can sign in, and at which level')),
    h('button', { type: 'button', class: 'btn primary', onclick: async () => {
      const v = await dialog('Add user', [{ name: 'name', label: 'Name', required: true }, { name: 'username', label: 'Username', required: true }, { name: 'role', label: 'Level', options: LEVELS.map(([value, label]) => ({ value, label })), value: 'planner' }], 'Add user');
      if (v) { S.users.push({ id: nextId++, ...v, active: true }); toast(`${v.name} added as ${ROLE_NAME[v.role]}`, 'ok'); render(); }
    } }, '+ Add user')));
  out.append(h('section', { class: 'card pad' }, h('div', { class: 'grid3' }, LEVELS.map(([r, l, d]) => h('div', { class: 'stack', style: { gap: '6px' } }, h('span', { class: `role ${r}`, style: { alignSelf: 'flex-start' } }, l), h('span', { class: 'small muted' }, d))))));
  out.append(h('section', { class: 'card' }, h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl', style: { minWidth: '560px' } },
    h('thead', {}, h('tr', {}, ['Name', 'Username', 'Level', 'Active'].map((x) => h('th', {}, x)))),
    h('tbody', {}, S.users.map((u) => { const me = u.name === S.user.name;
      const r = sel(LEVELS.map(([value, label]) => ({ value, label })), u.role, { class: 'inp', 'aria-label': `Level of ${u.name}`, disabled: me });
      r.addEventListener('change', () => { u.role = r.value; toast(`${u.name} is now ${ROLE_NAME[u.role]}`, 'ok'); });
      const a = h('input', { type: 'checkbox', checked: u.active, 'aria-label': `${u.name} can sign in`, disabled: me });
      a.addEventListener('change', () => { u.active = a.checked; toast(`${u.name} ${u.active ? 'can sign in again' : 'can no longer sign in'}`, 'ok'); });
      return h('tr', {}, h('td', {}, u.name, me ? h('span', { class: 'small muted' }, ' (you)') : null), h('td', { class: 'code' }, u.username), h('td', {}, r), h('td', {}, a)); }))))));
}

render();
})();
</script>
